<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-labelledby="t-ws2812w d-ws2812w">
  <title id="t-ws2812w">WS2812 LED strip wiring &#8212; small strip (direct) and large strip (external PSU)</title>
  <desc id="d-ws2812w">Two wiring diagrams showing how to connect WS2812 LED strips to an ESP32: direct power for small strips under 20 LEDs, and external 5V PSU with common ground for large strips.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .box      { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .strip    { fill: #faf5ff; stroke: #6b46c1; stroke-width: 2; }
      .psu      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .wire-pwr { stroke: #c53030; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-gnd { stroke: #4a5568; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-data{ stroke: #6b46c1; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .wire-common{stroke: #d69e2e; stroke-width: 3; fill: none; stroke-linecap: round; stroke-dasharray: 6 3; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 12px; fill: #1a202c; text-anchor: start; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
      .warn     { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #c53030; text-anchor: start; }
    ]]></style>
  </defs>
  <rect class="panel" width="880" height="500"/>

  <!-- ========== TOP PANEL: Small strip (direct power) ========== -->
  <rect class="box" x="20" y="10" width="840" height="190" rx="8"/>
  <text class="head" x="440" y="36">Small strip (under 20 LEDs, direct power)</text>

  <!-- ESP32 MCU box -->
  <rect class="box" x="60" y="60" width="200" height="120" rx="8"/>
  <text class="title" x="160" y="84">ESP32 MCU</text>
  <text class="pinL" x="76" y="110">GPIO 18</text>
  <text class="pinL" x="76" y="134">5V</text>
  <text class="pinL" x="76" y="158">GND</text>
  <!-- pin dots -->
  <circle cx="248" cy="106" r="3" fill="#6b46c1"/>
  <circle cx="248" cy="130" r="3" fill="#c53030"/>
  <circle cx="248" cy="154" r="3" fill="#4a5568"/>

  <!-- WS2812 strip box -->
  <rect class="strip" x="560" y="60" width="260" height="120" rx="8"/>
  <text class="title" x="690" y="84">WS2812 Strip</text>
  <text class="smallL" x="576" y="100">(&#60; 20 LEDs)</text>
  <text class="pinL" x="576" y="122">DIN</text>
  <text class="pinL" x="576" y="146">VCC</text>
  <text class="pinL" x="576" y="166">GND</text>
  <!-- pin dots -->
  <circle cx="572" cy="118" r="3" fill="#6b46c1"/>
  <circle cx="572" cy="142" r="3" fill="#c53030"/>
  <circle cx="572" cy="162" r="3" fill="#4a5568"/>
  <!-- decorative LED squares -->
  <rect x="710" y="110" width="14" height="14" rx="2" fill="#48bb78" opacity="0.7"/>
  <rect x="730" y="110" width="14" height="14" rx="2" fill="#c53030" opacity="0.7"/>
  <rect x="750" y="110" width="14" height="14" rx="2" fill="#4299e1" opacity="0.7"/>
  <rect x="770" y="110" width="14" height="14" rx="2" fill="#48bb78" opacity="0.7"/>
  <rect x="790" y="110" width="14" height="14" rx="2" fill="#ecc94b" opacity="0.7"/>

  <!-- Wires: GPIO to DIN (data), 5V to VCC (power), GND to GND (ground) -->
  <line class="wire-data" x1="251" y1="106" x2="569" y2="118"/>
  <line class="wire-pwr"  x1="251" y1="130" x2="569" y2="142"/>
  <line class="wire-gnd"  x1="251" y1="154" x2="569" y2="162"/>

  <!-- wire labels -->
  <text class="smallL" x="380" y="100">Data (GPIO)</text>
  <text class="smallL" x="395" y="132">5V</text>
  <text class="smallL" x="390" y="164">GND</text>

  <!-- ========== BOTTOM PANEL: Large strip (external PSU) ========== -->
  <rect class="box" x="20" y="218" width="840" height="230" rx="8"/>
  <text class="head" x="440" y="244">Large strip (external 5V PSU)</text>

  <!-- ESP32 MCU box -->
  <rect class="box" x="60" y="264" width="200" height="90" rx="8"/>
  <text class="title" x="160" y="288">ESP32 MCU</text>
  <text class="pinL" x="76" y="312">GPIO 18</text>
  <text class="pinL" x="76" y="336">GND</text>
  <!-- pin dots -->
  <circle cx="248" cy="308" r="3" fill="#6b46c1"/>
  <circle cx="248" cy="332" r="3" fill="#4a5568"/>

  <!-- External 5V PSU box -->
  <rect class="psu" x="320" y="310" width="160" height="80" rx="8"/>
  <text class="title" x="400" y="334">External 5V PSU</text>
  <text class="pinL" x="336" y="358">+5V</text>
  <text class="pinL" x="336" y="378">GND</text>
  <!-- pin dots -->
  <circle cx="468" cy="354" r="3" fill="#c53030"/>
  <circle cx="468" cy="374" r="3" fill="#4a5568"/>

  <!-- WS2812 strip box -->
  <rect class="strip" x="580" y="264" width="260" height="120" rx="8"/>
  <text class="title" x="710" y="288">WS2812 Strip</text>
  <text class="smallL" x="596" y="304">(&#62; 20 LEDs)</text>
  <text class="pinL" x="596" y="326">DIN</text>
  <text class="pinL" x="596" y="350">VCC</text>
  <text class="pinL" x="596" y="370">GND</text>
  <!-- pin dots -->
  <circle cx="592" cy="322" r="3" fill="#6b46c1"/>
  <circle cx="592" cy="346" r="3" fill="#c53030"/>
  <circle cx="592" cy="366" r="3" fill="#4a5568"/>
  <!-- decorative LED squares -->
  <rect x="700" y="314" width="14" height="14" rx="2" fill="#48bb78" opacity="0.7"/>
  <rect x="720" y="314" width="14" height="14" rx="2" fill="#c53030" opacity="0.7"/>
  <rect x="740" y="314" width="14" height="14" rx="2" fill="#4299e1" opacity="0.7"/>
  <rect x="760" y="314" width="14" height="14" rx="2" fill="#48bb78" opacity="0.7"/>
  <rect x="780" y="314" width="14" height="14" rx="2" fill="#ecc94b" opacity="0.7"/>
  <rect x="800" y="314" width="14" height="14" rx="2" fill="#9f7aea" opacity="0.7"/>

  <!-- Wires: ESP32 GPIO to strip DIN (data) -->
  <polyline class="wire-data" points="251,308 530,308 530,322 589,322"/>

  <!-- Wires: PSU +5V to strip VCC (power) -->
  <line class="wire-pwr" x1="471" y1="354" x2="540" y2="354"/>
  <polyline class="wire-pwr" points="540,354 540,346 589,346"/>

  <!-- Wires: PSU GND to strip GND (ground) -->
  <line class="wire-gnd" x1="471" y1="374" x2="550" y2="374"/>
  <polyline class="wire-gnd" points="550,374 550,366 589,366"/>

  <!-- Common ground: ESP32 GND to PSU GND junction (dashed yellow) -->
  <polyline class="wire-common" points="251,332 290,332 290,410 500,410 500,374"/>
  <!-- Common ground junction dot -->
  <circle cx="500" cy="374" r="4" fill="#d69e2e"/>

  <!-- COMMON GROUND WARNING label -->
  <text class="warn" x="296" y="424">&#9888; COMMON GROUND REQUIRED!</text>

  <!-- Capacitor note near strip power input -->
  <text class="smallL" x="596" y="396">&#8776; 1000 &#181;F cap across</text>
  <text class="smallL" x="596" y="408">VCC/GND near strip input</text>
  <!-- capacitor symbol -->
  <line x1="580" y1="396" x2="580" y2="408" stroke="#4a5568" stroke-width="1.5"/>
  <line x1="586" y1="396" x2="586" y2="408" stroke="#4a5568" stroke-width="1.5"/>

  <!-- ========== LEGEND ========== -->
  <g transform="translate(30, 460)">
    <text class="titleL" x="0" y="0">Legend</text>

    <!-- Data wire -->
    <line class="wire-data" x1="0" y1="14" x2="24" y2="14"/>
    <text class="legend" x="30" y="18">Data (GPIO &#8594; DIN)</text>

    <!-- Power wire -->
    <line class="wire-pwr" x1="200" y1="14" x2="224" y2="14"/>
    <text class="legend" x="230" y="18">5V Power (VCC)</text>

    <!-- Ground wire -->
    <line class="wire-gnd" x1="380" y1="14" x2="404" y2="14"/>
    <text class="legend" x="410" y="18">Ground (GND)</text>

    <!-- Common ground wire -->
    <line class="wire-common" x1="540" y1="14" x2="564" y2="14"/>
    <text class="legend" x="570" y="18">Common ground (critical)</text>

    <!-- Strip box sample -->
    <rect class="strip" x="748" y="6" width="16" height="16" rx="3"/>
    <text class="legend" x="770" y="18">WS2812 strip</text>
  </g>
</svg>
