<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580" role="img" aria-labelledby="t-ws d-ws">
  <title id="t-ws">WS2812 NRZ bit-encoding and 24-bit pixel cascade</title>
  <desc id="d-ws">Top: a single-wire frame carries 24 bits per LED (G7..G0, R7..R0, B7..B0); each LED latches its own 24 bits and forwards the remainder to the next pixel via DOUT. Bottom: NRZ encoding - long high = 1, short high = 0; an idle period >= 50 microseconds latches the strip.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .panel    { fill: #ffffff; }
      .panelL   { fill: #ffffff; stroke: #1a365d; stroke-width: 2; }
      .led      { fill: #fef5e7; stroke: #c05621; stroke-width: 2; }
      .pix0     { fill: #fed7d7; stroke: #c53030; stroke-width: 1.4; }
      .pix1     { fill: #c6f6d5; stroke: #276749; stroke-width: 1.4; }
      .pix2     { fill: #bee3f8; stroke: #2c5282; stroke-width: 1.4; }
      .box      { fill: #f4f6f8; stroke: #1a365d; stroke-width: 2; }
      .wire-data{ stroke: #2b6cb0; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .axis     { stroke: #1a365d; stroke-width: 1.5; fill: none; }
      .pulse-1  { stroke: #c53030; stroke-width: 2.5; fill: none; }
      .pulse-0  { stroke: #276749; stroke-width: 2.5; fill: none; }
      .head     { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .title    { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: middle; }
      .titleL   { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #1a365d; text-anchor: start; }
      .label    { font-family: system-ui, sans-serif; font-size: 12px; fill: #1a202c; text-anchor: middle; }
      .small    { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: middle; }
      .smallL   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: start; }
      .smallR   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; text-anchor: end; }
      .pin      { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: middle; }
      .pinL     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: start; }
      .pinR     { font-family: "DejaVu Sans Mono", Consolas, monospace; font-size: 11px; fill: #1a202c; text-anchor: end; }
      .byte     { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #1a202c; text-anchor: middle; }
      .pixL     { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .legend   { font-family: system-ui, sans-serif; font-size: 11px; fill: #4a5568; }
    ]]></style>
    <marker id="ar-ws" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect class="panel" width="820" height="580"/>

  <text class="head"  x="410" y="26">WS2812 / 2812B / 2813 / SK6812 - single-wire NRZ encoding</text>
  <text class="small" x="410" y="44">Driver feeds the ESP32 RMT peripheral, which generates the bit-precise pulse widths in hardware.</text>

  <!-- ===== Section 1: Strip cascade (y=64..200) ===== -->
  <text class="title" x="410" y="68">Strip cascade - each LED latches its own 24 bits, forwards the rest</text>

  <!-- MCU -->
  <rect class="box" x="30" y="84" width="100" height="60" rx="6"/>
  <text class="title" x="80" y="106">MCU + RMT</text>
  <text class="pin"   x="80" y="124">DIN</text>
  <text class="small" x="80" y="138">800 kHz NRZ</text>

  <!-- 4 LEDs along y=84..144 -->
  <g>
    <rect class="led" x="170" y="84" width="120" height="60" rx="6"/>
    <text class="title" x="230" y="104">LED #0</text>
    <text class="pinL" x="180" y="126" >DIN</text>
    <text class="pinR" x="280" y="126" >DOUT</text>

    <rect class="led" x="320" y="84" width="120" height="60" rx="6"/>
    <text class="title" x="380" y="104">LED #1</text>
    <text class="pinL" x="330" y="126" >DIN</text>
    <text class="pinR" x="440" y="126" >DOUT</text>

    <rect class="led" x="470" y="84" width="120" height="60" rx="6"/>
    <text class="title" x="530" y="104">LED #2</text>
    <text class="pinL" x="480" y="126" >DIN</text>
    <text class="pinR" x="580" y="126" >DOUT</text>

    <rect class="led" x="620" y="84" width="100" height="60" rx="6"/>
    <text class="title" x="670" y="104">LED #N</text>
    <text class="pinL" x="630" y="126" >DIN</text>
    <text class="smallR" x="700" y="138" >... continue</text>
  </g>

  <!-- DIN -> DOUT wires -->
  <line class="wire-data" x1="130" y1="124" x2="170" y2="124" marker-end="url(#ar-ws)"/>
  <line class="wire-data" x1="290" y1="124" x2="320" y2="124" marker-end="url(#ar-ws)"/>
  <line class="wire-data" x1="440" y1="124" x2="470" y2="124" marker-end="url(#ar-ws)"/>
  <line class="wire-data" x1="590" y1="124" x2="620" y2="124" marker-end="url(#ar-ws)"/>

  <!--
    24 bits-per-pixel byte ribbon (frame layout shown abstractly).
    Each pixel = 3 bytes (G, R, B). Each byte = one cell, 50 px wide, 30 px tall.
    Pixel 0 (red bg)  : x =  60, 110, 160   (ends at x=210)
    gap 24 px
    Pixel 1 (green bg): x = 234, 284, 334   (ends at x=384)
    gap 24 px
    Pixel 2 (blue bg) : x = 408, 458, 508   (ends at x=558)
    Annotation starts at x=580.
  -->
  <g transform="translate(0, 168)">
    <text class="pixL" fill="#c53030"  x="135" y="-4">Pixel 0 (24 bits)</text>
    <text class="pixL" fill="#276749"  x="309" y="-4">Pixel 1 (24 bits)</text>
    <text class="pixL" fill="#2c5282"  x="483" y="-4">Pixel 2 (24 bits)</text>

    <rect class="pix0" x="60"  y="0" width="50" height="30"/>
    <text class="byte" x="85"  y="20">G byte</text>
    <rect class="pix0" x="110" y="0" width="50" height="30"/>
    <text class="byte" x="135" y="20">R byte</text>
    <rect class="pix0" x="160" y="0" width="50" height="30"/>
    <text class="byte" x="185" y="20">B byte</text>

    <rect class="pix1" x="234" y="0" width="50" height="30"/>
    <text class="byte" x="259" y="20">G byte</text>
    <rect class="pix1" x="284" y="0" width="50" height="30"/>
    <text class="byte" x="309" y="20">R byte</text>
    <rect class="pix1" x="334" y="0" width="50" height="30"/>
    <text class="byte" x="359" y="20">B byte</text>

    <rect class="pix2" x="408" y="0" width="50" height="30"/>
    <text class="byte" x="433" y="20">G byte</text>
    <rect class="pix2" x="458" y="0" width="50" height="30"/>
    <text class="byte" x="483" y="20">R byte</text>
    <rect class="pix2" x="508" y="0" width="50" height="30"/>
    <text class="byte" x="533" y="20">B byte</text>

    <text class="smallL" x="580" y="14" >. . . continues</text>
    <text class="smallL" x="580" y="28" >for N pixels (RGBW: +W byte)</text>
  </g>

  <text class="small" x="410" y="226">Each LED latches the first 24 bits it sees and forwards the rest unchanged through DOUT to the next pixel.</text>

  <!-- ===== Section 2: NRZ bit encoding (y=250..520) ===== -->
  <rect class="panelL" x="30" y="250" width="760" height="270" rx="6"/>
  <text class="title" x="410" y="270">NRZ bit encoding (typical WS2812B values)</text>

  <!-- '0' bit row: y=290..360 -->
  <text class="titleL" x="60" y="294"  fill="#276749">'0' bit  (short HIGH, long LOW)</text>
  <text class="smallL" x="60" y="312" >bit period = 1.25 us  (T0H ~ 400 ns, T0L ~ 850 ns)</text>

  <!-- Single '0' bit pulse, large and clear, x = 100 .. 600 (500 px = 1.25 us, so 1 us = 400 px). -->
  <line class="axis" x1="100" y1="354" x2="600" y2="354"/>
  <text class="smallR" x="80" y="358" >LOW</text>
  <text class="smallR" x="80" y="332" >HIGH</text>

  <!--
    '0' bit single pulse repeated 4 times for visibility.
    Period = 125 px. T0H = 40 px, T0L = 85 px.
    Pulse pattern repeated 4 times (total 500 px).
  -->
  <path class="pulse-0" d="
    M 100 354 L 100 326 L 140 326 L 140 354
    L 225 354 L 225 326 L 265 326 L 265 354
    L 350 354 L 350 326 L 390 326 L 390 354
    L 475 354 L 475 326 L 515 326 L 515 354
    L 600 354"/>

  <!-- Annotate 1st period -->
  <line stroke="#1a365d" stroke-width="0.8" x1="100" y1="320" x2="100" y2="368"/>
  <line stroke="#1a365d" stroke-width="0.8" x1="225" y1="320" x2="225" y2="368"/>
  <line stroke="#1a365d" stroke-width="0.8" x1="140" y1="320" x2="140" y2="328"/>
  <text class="small" x="120" y="318">T0H</text>
  <text class="small" x="183" y="318">T0L</text>
  <text class="small" x="162" y="378">1.25 us bit period</text>

  <!-- '1' bit row: y=400..490 -->
  <text class="titleL" x="60" y="404"  fill="#c53030">'1' bit  (long HIGH, short LOW)</text>
  <text class="smallL" x="60" y="422" >bit period = 1.25 us  (T1H ~ 800 ns, T1L ~ 450 ns)</text>

  <line class="axis" x1="100" y1="464" x2="600" y2="464"/>
  <text class="smallR" x="80" y="468" >LOW</text>
  <text class="smallR" x="80" y="442" >HIGH</text>

  <!--
    '1' bit pattern: T1H = 80 px, T1L = 45 px, period = 125 px.
    Repeated 4 times.
  -->
  <path class="pulse-1" d="
    M 100 464 L 100 436 L 180 436 L 180 464
    L 225 464 L 225 436 L 305 436 L 305 464
    L 350 464 L 350 436 L 430 436 L 430 464
    L 475 464 L 475 436 L 555 436 L 555 464
    L 600 464"/>

  <line stroke="#1a365d" stroke-width="0.8" x1="100" y1="430" x2="100" y2="478"/>
  <line stroke="#1a365d" stroke-width="0.8" x1="225" y1="430" x2="225" y2="478"/>
  <line stroke="#1a365d" stroke-width="0.8" x1="180" y1="430" x2="180" y2="438"/>
  <text class="small" x="140" y="428">T1H</text>
  <text class="small" x="203" y="428">T1L</text>
  <text class="small" x="162" y="488">1.25 us bit period</text>

  <!-- Reset annotation block on the right (y=290..490) -->
  <rect class="box" x="630" y="290" width="140" height="160" rx="6"/>
  <text class="title" x="700" y="310">Reset (latch)</text>
  <text class="small" x="700" y="332">>= 50 us idle</text>
  <text class="small" x="700" y="348">DIN held LOW</text>
  <text class="small" x="700" y="370">latches the strip</text>
  <text class="small" x="700" y="392">WS2813:  >= 250 us</text>
  <text class="small" x="700" y="408">SK6812:  >= 80 us</text>
  <text class="small" x="700" y="432">-> visible update</text>

  <!-- Bottom legend in its own row -->
  <g transform="translate(60, 538)">
    <text class="titleL" x="0" y="0"  fill="#1a365d">Legend</text>
    <rect class="pix0" x="0"   y="14" width="14" height="14"/>
    <text class="legend" x="22"  y="25">Pixel 0 byte (G/R/B)</text>
    <rect class="pix1" x="160" y="14" width="14" height="14"/>
    <text class="legend" x="182" y="25">Pixel 1 byte</text>
    <rect class="pix2" x="270" y="14" width="14" height="14"/>
    <text class="legend" x="292" y="25">Pixel 2 byte</text>
    <line class="pulse-0" x1="380" y1="22" x2="404" y2="22"/>
    <text class="legend" x="412" y="25">'0' bit (short-high)</text>
    <line class="pulse-1" x1="540" y1="22" x2="564" y2="22"/>
    <text class="legend" x="572" y="25">'1' bit (long-high)</text>
  </g>
</svg>
